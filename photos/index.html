<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meighan &amp; Eric · Share your photos</title>
<script>
  // The QR code on the table cards points here. Paste the guest upload link between the quotes.
  const ALBUM = '';
  if (ALBUM) location.replace(ALBUM);

<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f3;color:#293d4d;font-family:Georgia,'Times New Roman',serif;text-align:center}
  main{padding:32px 24px;max-width:420px}
  h1{font-weight:normal;font-style:italic;font-size:2.4rem;margin:0 0 6px}
  .sub{letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:#53646c;margin:0 0 28px}
  p{font-size:1.1rem;line-height:1.5}
  a{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:6px;background:#722d42;color:#fff;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>Share the love</h1>
  <p class="sub">Meighan &amp; Eric · October 10, 2026</p>
  <p id="msg">The photo album opens on the wedding day. Please check back soon!</p>
  <p id="go" hidden><a id="link" href="#">Open the photo album</a></p>
</main>
<script>
  if (ALBUM) {
    document.getElementById('msg').textContent = 'Opening the photo album…';
    document.getElementById('link').href = ALBUM;
    document.getElementById('go').hidden = false;
  }
</script>
